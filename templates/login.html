{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 100px;">
    <div class="col-md-4">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">🏛️ Вход в систему</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" name="username" class="form-control" placeholder="admin или operator" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" placeholder="admin123 или op123" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            
            <div class="mt-3 text-center text-muted">
                <div class="mt-3 text-center text-muted">
    <small>Тест: admin / admin123</small><br>
    <small>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></small>
</div>
                <small>Тест: admin / admin123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
